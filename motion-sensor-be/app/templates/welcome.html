<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        background-color: #000;
        color: #00ff00;
        font-family: "Courier New", Courier, monospace;
        margin: 0;
        padding: 20px;
      }
      .wrapper {
        border: 1px solid #00ff00;
        padding: 20px;
        max-width: 600px;
        margin: 0 auto;
      }
      .header {
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 2px;
      }
      .divider {
        border-top: 1px dashed #00ff00;
        margin: 15px 0;
      }
      .body-text {
        font-size: 14px;
        line-height: 1.5;
        margin-bottom: 20px;
      }
      .title {
        font-size: 18px;
        text-transform: uppercase;
        margin: 0 0 10px 0;
      }
      .footer {
        font-size: 12px;
        text-align: right;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="header">MOTION-SENSOR</div>
      <div class="divider"></div>
      <div class="body-text">
        <p class="title">Welcome, {{ name }}!</p>
        <p class="copy">
          Thank you for joining the Motion Sensor network. Your account has been created.
        </p>
        <p class="copy">
          You will receive a separate email containing your OTP verification code to verify this email address.
        </p>
      </div>
      <div class="divider"></div>
      <div class="footer">MOTION-SENSOR SYSTEM // NO REPLY</div>
    </div>
  </body>
</html>
