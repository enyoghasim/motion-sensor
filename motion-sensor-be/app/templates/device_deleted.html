<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; color: #333; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .header { background-color: #e53e3e; color: white; padding: 20px; text-align: center; border-radius: 8px 8px 0 0; }
        .content { padding: 30px; border: 1px solid #e2e8f0; border-top: none; border-radius: 0 0 8px 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>Device Deleted</h2>
        </div>
        <div class="content">
            <p>Hello,</p>
            <p>Your device <strong>{{ device_name }}</strong> has been successfully deleted from your account.</p>
            <p>If you did not authorize this action, please change your password immediately and contact support.</p>
            <p>Best regards,<br>Motion Sensor Team</p>
        </div>
    </div>
</body>
</html>
