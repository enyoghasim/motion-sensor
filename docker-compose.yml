services:
  postgres:
    image: postgres:15
    container_name: motion-sensor-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - motion-sensor-network

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: motion-sensor-mosquitto
    ports:
      - "${MQTT_HOST_PORT}:1883"
      - "${MQTT_WS_HOST_PORT}:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ping -q 0 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - motion-sensor-network

  redis:
    image: redis:7-alpine
    container_name: motion-sensor-redis
    ports:
      - "${REDIS_HOST_PORT}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - motion-sensor-network

  motion-sensor-be:
    build: ./motion-sensor-be
    container_name: motion-sensor-backend
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT}:8080"
    volumes:
      - ./motion-sensor-be:/app
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT}
      - WATCHFILES_FORCE_POLLING=true
      - REDIS_URL=redis://redis:6379/0
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
    restart: unless-stopped
    networks:
      - motion-sensor-network

  motion-sensor-worker:
    build: ./motion-sensor-be
    container_name: motion-sensor-worker
    command: celery -A app.core.celery_app worker --loglevel=info
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./motion-sensor-be:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
    restart: unless-stopped
    networks:
      - motion-sensor-network

networks:
  motion-sensor-network:
    driver: bridge

volumes:
  postgres_data:
